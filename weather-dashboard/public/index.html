<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time Weather Dashboard">
    <title>Weather Dashboard - Real-time Weather</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/responsive.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-container">
                <div class="logo">
                    <span class="logo-icon">🌦️</span>
                    <h1>Weather Dashboard</h1>
                </div>
                <div class="header-actions">
                    <button class="btn-theme" id="themeBtn" title="Toggle Dark Mode">🌙</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search Section -->
            <section class="search-section">
                <div class="search-container">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput" 
                        placeholder="Search city..."
                        autocomplete="off"
                    >
                    <button class="btn-search" id="searchBtn">🔍</button>
                    <button class="btn-location" id="locationBtn" title="Use my location">📍</button>
                </div>
                <div class="search-suggestions" id="searchSuggestions"></div>
            </section>

            <!-- Current Weather -->
            <section class="weather-section">
                <div class="current-weather" id="currentWeather">
                    <div class="loading">Loading...</div>
                </div>
            </section>

            <!-- Forecast Section -->
            <section class="forecast-section">
                <h2>5-Day Forecast</h2>
                <div class="forecast-grid" id="forecastGrid">
                    <div class="loading">Loading forecast...</div>
                </div>
            </section>

            <!-- Details Section -->
            <section class="details-section">
                <h2>Weather Details</h2>
                <div class="details-grid" id="detailsGrid">
                    <div class="loading">Loading details...</div>
                </div>
            </section>

            <!-- Saved Locations -->
            <section class="saved-locations-section">
                <h2>Saved Locations</h2>
                <div class="saved-locations" id="savedLocations">
                    <p class="empty-message">No saved locations</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Weather data provided by <strong>OpenWeatherMap</strong></p>
            <p>&copy; 2024 Weather Dashboard. All rights reserved.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
